name: Compile diagnose

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile Android (Kotlin)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileDebugKotlinAndroid --continue --console=plain --stacktrace 2>&1 | tee build.log
      - name: Report compiler errors as annotations
        if: always()
        run: python3 .github/scripts/report_errors.py build.log
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Compile Desktop (Kotlin)
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :composeApp:compileKotlinDesktop --continue --console=plain --stacktrace 2>&1 | tee build.log
      - name: Report compiler errors as annotations
        if: always()
        run: python3 .github/scripts/report_errors.py build.log
      - name: Fail if the build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
