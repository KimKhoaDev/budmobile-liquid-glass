name: Build PhimBud iOS IPA (Sideloadly)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ios-ipa:
    name: Build Unsigned PhimBud.ipa on macOS
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-2.1.10

      - name: Setup Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure gradlew is executable
        run: chmod +x ./gradlew

      - name: Build Release iOS App (arm64, unsigned for Sideloadly)
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath iosApp/build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package Payload into PhimBud.ipa
        run: |
          APP_PATH="iosApp/build/Build/Products/Release-iphoneos/PhimBud.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: Built PhimBud.app not found at $APP_PATH"
            find iosApp/build -maxdepth 5
            exit 1
          fi
          rm -rf build_ipa Payload PhimBud.ipa
          mkdir -p build_ipa/Payload
          cp -R "$APP_PATH" build_ipa/Payload/
          cd build_ipa
          zip -qry ../PhimBud.ipa Payload
          cd ..
          ls -lh PhimBud.ipa

      - name: Upload PhimBud.ipa Artifact (Ready for Sideloadly)
        uses: actions/upload-artifact@v4
        with:
          name: PhimBud-iOS-IPA
          path: PhimBud.ipa
          if-no-files-found: error
          retention-days: 30
